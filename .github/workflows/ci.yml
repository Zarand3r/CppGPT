# CI — the one genuinely open M0 item.
#
# Every "30/30 green" before this meant "green on one machine, when someone
# remembered to run it". These four gates are the claims the repo actually makes
# about itself, each checked rather than asserted.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The toolchain is hermetic (pinned LLVM in MODULE.bazel), so the cache is
      # the only thing standing between this and a very slow job.
      - name: Cache bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelrc') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Test (dev)
        run: bazel test //... --config=dev

      - name: Test (release)
        run: bazel test //... --config=release

      # The parity gate is the repo's strongest correctness claim, so its numbers
      # are printed rather than merely passed -- a silent pass hides a margin that
      # is drifting toward the tolerance.
      - name: PyTorch parity margins
        run: bazel test //tests/integration:parity_test --config=release
             --test_output=all --nocache_test_results | grep -E "parity:|PASS"

      # "The binaries link only libc and libm" is why this repo can claim no
      # runtime dependencies. A claim nothing checks quietly stops being true.
      - name: Dynamic-dependency allow-list
        run: |
          bazel build //tools:all --config=release
          tools/check_ldd.sh

      - name: Sanitizers (ASan + UBSan)
        run: bazel test //tests/... --config=asan --nocache_test_results

      # The viewer is a single self-contained page with no test target: this is
      # the only thing that checks it is wired up and renders.
      #
      # Called directly, with NO `||` fallback. The first version fell back to a
      # weaker inline id-check when check_viewer.py exited non-zero, and that is
      # exactly what happened: the panel-render half never ran in CI and the step
      # still went green. A fallback that silently substitutes a weaker check is
      # indistinguishable from the strong check passing.
      - name: Viewer wiring and render
        run: |
          sudo apt-get update -qq && sudo apt-get install -y nodejs
          bazel build //tools:prepare //tools:train //tools:inspect --config=release
          # A real dump, because --require-dump makes the panel check mandatory and
          # data/ is gitignored. Without generating one the check would WARN and
          # still exit 0 -- the panel half silently never running, which is the
          # exact failure this step already had once.
          python3 - <<'PY'
          import random
          random.seed(7)
          w = ["the","a","king","queen","speak","hath","thou","art","love","night"]
          open("/tmp/ci_corpus.txt","w").write(
              "\n".join(" ".join(random.choice(w) for _ in range(8)) for _ in range(2000)))
          PY
          B=bazel-out/k8-opt/bin/tools
          $B/prepare /tmp/ci_corpus.txt /tmp/ci --val-frac 0.1
          $B/train --data /tmp/ci.train.bin --layers 2 --heads 2 --embd 64 --ctx 32 \
                   --batch 8 --steps 30 --ckpt /tmp/ci.ckpt
          $B/inspect --checkpoint /tmp/ci.ckpt --vocab /tmp/ci.vocab \
                     --prompt "the king" --out /tmp/ci_run.json --top-k 5
          python3 tools/check_viewer.py --html tools/viewer.html --dump /tmp/ci_run.json --require-dump
